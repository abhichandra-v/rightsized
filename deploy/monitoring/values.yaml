# kube-prometheus-stack, trimmed to what rightsized reads: cAdvisor (usage, throttling, OOM
# events), kube-state-metrics (restarts, termination reasons) and node counts.
alertmanager:
  enabled: false
grafana:
  enabled: false
prometheus:
  # Fixed NodePort, mapped to localhost:9090 by deploy/kind/cluster.yaml.
  service:
    type: NodePort
    nodePort: 30090
  prometheusSpec:
    scrapeInterval: 15s
    retention: 15d
    resources:
      requests: { cpu: 200m, memory: 1Gi }
kubelet:
  serviceMonitor:
    cAdvisor: true
