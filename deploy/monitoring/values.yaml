# kube-prometheus-stack, trimmed to what rightsized reads: cAdvisor (usage, throttling, OOM
# events), kube-state-metrics (restarts, termination reasons) and node counts.
alertmanager:
  enabled: false
grafana:
  enabled: false
prometheus:
  prometheusSpec:
    scrapeInterval: 15s
    retention: 15d
    resources:
      requests: { cpu: 200m, memory: 1Gi }
kubelet:
  serviceMonitor:
    cAdvisor: true
