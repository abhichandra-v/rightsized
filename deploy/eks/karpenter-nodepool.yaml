# One on-demand instance type, so measured savings = nodes removed x one known price.
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: boutique
spec:
  template:
    metadata:
      labels: { rightsized.io/pool: boutique }
    spec:
      requirements:
        - { key: node.kubernetes.io/instance-type, operator: In, values: [m6i.large] }
        - { key: karpenter.sh/capacity-type, operator: In, values: [on-demand] }
      nodeClassRef: { group: karpenter.k8s.aws, kind: EC2NodeClass, name: default }
  limits:
    cpu: "16"                          # hard cap on spend: at most 8 nodes
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 2m
---
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  amiSelectorTerms: [{ alias: al2023@latest }]
  role: eksctl-KarpenterNodeRole-rightsized-run
  subnetSelectorTerms: [{ tags: { karpenter.sh/discovery: rightsized-run } }]
  securityGroupSelectorTerms: [{ tags: { karpenter.sh/discovery: rightsized-run } }]
  tags: { project: rightsized-run }
