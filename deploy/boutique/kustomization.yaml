apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: boutique

resources:
  - namespace.yaml
  # Pinned upstream release, fetched by `make boutique-manifests`.
  - upstream/kubernetes-manifests.yaml
  - blast-radius.yaml

# The file rightsized edits. `make reset` restores it from resources.guessed.yaml.
# (patchesStrategicMerge is deprecated but, unlike `patches`, takes a multi-document file.)
patchesStrategicMerge:
  - resources.yaml

patches:
  # k6 replaces the bundled Locust load generator so baseline and candidate get identical load.
  - patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: loadgenerator
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: frontend
      spec:
        replicas: 2
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: checkoutservice
        labels: { rightsized.io/criticality: critical }
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: paymentservice
        labels: { rightsized.io/criticality: critical }
  # Fixed NodePort so k6 reaches the frontend through kind's port mapping (see deploy/kind).
  - patch: |-
      apiVersion: v1
      kind: Service
      metadata:
        name: frontend-external
      spec:
        type: NodePort
        ports:
          - name: http
            port: 80
            targetPort: 8080
            nodePort: 30080
