# "Developer-guessed" requests: round numbers, copy-pasted between services, mostly too
# big, with two deliberate under-sizings:
#   - adservice (Java) has a memory limit close to its heap, so it should OOM under load.
#   - currencyservice has a 100m CPU limit on the hottest call path, so it should throttle.
# rightsized edits resources.yaml; `make reset` copies this file back over it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  template:
    spec:
      containers:
        - name: server
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
