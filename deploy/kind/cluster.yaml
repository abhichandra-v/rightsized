kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: rightsized
nodes:
  - role: control-plane
    # NodePorts reachable from the host: no kubectl port-forward in the load path.
    extraPortMappings:
      - { containerPort: 30080, hostPort: 8080 }   # Boutique frontend
      - { containerPort: 30090, hostPort: 9090 }   # Prometheus
  - role: worker
  - role: worker
  - role: worker
