[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rightsized"
version = "0.1.0"
description = "Risk-scored, GitOps-native, load-test-verified Kubernetes right-sizing."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["ruamel.yaml>=0.18"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
rightsized = "rightsized.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
